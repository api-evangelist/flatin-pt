name: flatin.pt
description: >-
  Portuguese property-tax APIs providing keyless access to IMI rates for all 308 municipalities and IMT/stamp duty
  purchase-cost calculations, sourced from official Autoridade Tributária tables. flatin.pt serves the same numbers as a
  REST API with an OpenAPI schema, a remote MCP server exposing four agent tools, an llms.txt for agent discovery, and a
  CC BY 4.0 open CSV dataset — no key and no sign-up.
