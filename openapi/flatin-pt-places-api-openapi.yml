        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/construction-barometer:
    get:
      tags:
      - Places
      summary: 'Construction barometer: building-works cases and INE licences'
      description: 'Without `municipality`: the 12-month count of municipal building-works cases for each municipality we collect, the change on the previous 12 months, cases per 1,000 residents, and the fixed-panel index. With `municipality`: our monthly (or yearly) series where we collect it, plus INE''s official yearly series of licensed buildings and new dwellings for any of the 308. A case is not a licence granted and not a building. The full series is at /api/v1/barometer/series.'
      operationId: construction_barometer_api_v1_construction_barometer_get
      parameters:
      - name: municipality
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Name or four-digit code
          examples:
          - Porto
          title: Municipality
        description: Name or four-digit code
      - name: measure
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Kind of works. Default: total_works'
          enum:
          - total_works
          - new_build
          - alter_extend
          title: Measure
        description: 'Kind of works. Default: total_works'
      - name: granularity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Period of our own series. Default: month'
          enum:
          - month
          - year
          title: Granularity
        description: 'Period of our own series. Default: month'
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Language of the site content in the answer (verdicts, definitions, labels) and of the page links: pt, en, ru, ua (or uk), de, fr, nl. Field names and the summary stay English. Default: en'
          examples:
          - en
          enum:
