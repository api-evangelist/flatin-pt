  /api/v1/glossary/{term}:
    get:
      tags:
      - Places
      summary: 'One glossary term: definition, law reference and page'
      description: Definition, where the term comes up when buying, the articles of law with the official text and the date they were checked. `term` is the term's key, its Portuguese or English name, a name in any site language or an abbreviation (IMT, CPCV, VPT); close spellings are found.
      operationId: glossary_term_api_v1_glossary__term__get
      parameters:
      - name: term
        in: path
        required: true
        schema:
          type: string
          description: Term
