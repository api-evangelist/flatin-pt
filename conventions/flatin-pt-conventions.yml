metadata:
  attribution: Every successful JSON answer carries an `attribution` field to display next to the numbers.
idempotency:
  coverage: na
  note: >-
    No write/mutation surface. The single POST (/api/v1/imt/calculate) is a pure, stateless tax
    calculation with no side effects — naturally idempotent, and no Idempotency-Key header exists
    or is needed. No replay protection applies because nothing is persisted.
reversibility:
  applicable: na
  note: >-
    Read-only compute API. No create/update/delete operations exist, so there is nothing to reverse.
    request_consultation (MCP-only) merely returns a form link; the person submits the form themselves.
